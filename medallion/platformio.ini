; SideKiqq medallion firmware
;   pio run -e xiao_esp32s3_sense -t upload     build + flash
;   pio device monitor                          serial log (115200)
;   pio test -e native                          host unit tests for lib/core (no hardware)

[platformio]
default_envs = xiao_esp32s3_sense

[env]
test_framework = unity

; ---------------------------------------------------------------- firmware
[esp32s3_base]
; espressif32 6.9.0 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4). NimBLE-Arduino 1.4.x targets this core;
; NimBLE-Arduino 2.x changed the callback API and needs Arduino-ESP32 3.x.
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; NimBLE: peripheral only, one connection, room for 240-byte notifications in flight.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=32
test_ignore = *    ; unit tests run on the native env only

[env:xiao_esp32s3_sense]
extends = esp32s3_base
board = seeed_xiao_esp32s3
; On-board PDM mic, discrete MOSFET haptic driver (see include/config.h for alternatives).

[env:xiao_esp32s3_inmp441]
; Plain XIAO ESP32-S3 (no Sense board) with an external INMP441 I2S mic and a DRV2605L.
extends = esp32s3_base
board = seeed_xiao_esp32s3
build_flags =
    ${esp32s3_base.build_flags}
    -DMIC_TYPE=2
    -DHAPTIC_DRIVER=2

[env:xiao_esp32s3_toggle]
; Same hardware as the default env, tap-to-talk with long-press cancel.
extends = esp32s3_base
board = seeed_xiao_esp32s3
build_flags =
    ${esp32s3_base.build_flags}
    -DPTT_MODE=1

; ---------------------------------------------------------------- host tests
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_build_src = no
